<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- PWA: installable on Android (Chrome) and iOS (Safari, "Adicionar à Tela de Início"). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Habitus" />
    <!-- Translucent: the page runs under the clock (edge to edge). iOS reads this when the app is added to the Home Screen.
         iOS 26+ would blur that edge; #status-bar below turns it into a solid band in the page colour instead. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Inside the desktop phone frame (src/state/desktop-frame.ts): still scrolls with the wheel, but no desktop
      // scrollbar, which would take 15 px off a phone-width page. Set here so it never shows while the app loads.
      if (window.self !== window.top) document.documentElement.style.scrollbarWidth = "none";
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
      }
      // A deploy renames every screen's bundle: an app left open would ask for files that are gone (black screen).
      // Back in the app, a page that points at another bundle means a new version: reload before anything breaks.
      // A screen bundle that fails to load reloads too, at most once a minute so a real outage cannot loop.
      (function () {
        const BUNDLE = 'script[src*="/_expo/static/js/web/"]';
        // Every bundle tag: the Metro runtime one alone rarely changes between deploys.
        const bundleOf = (doc) => [...doc.querySelectorAll(BUNDLE)].map((s) => s.getAttribute("src")).join(" ") || null;
        const reload = () => {
          try {
            const last = Number(sessionStorage.getItem("habitus:reloaded") || 0);
            if (Date.now() - last < 60000) return;
            sessionStorage.setItem("habitus:reloaded", String(Date.now()));
          } catch {}
          location.reload();
        };
        document.addEventListener("visibilitychange", () => {
          const current = bundleOf(document);
          if (document.visibilityState !== "visible" || !current) return; // no bundle tag: the dev server
          fetch("/", { cache: "no-store" })
            .then((response) => (response.ok ? response.text() : ""))
            .then((html) => {
              const next = bundleOf(new DOMParser().parseFromString(html, "text/html"));
              if (next && next !== current) reload();
            })
            .catch(() => {});
        });
        window.addEventListener(
          "error",
          (event) => {
            const src = event.target?.src;
            if (event.target?.tagName === "SCRIPT" && src?.includes("/_expo/static/js/web/")) reload();
          },
          true,
        );
      })();
      // Chrome fires this once, possibly before React mounts: keep it for the "Instalar agora" button.
      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        window.__habitusInstall = event;
        window.dispatchEvent(new Event("habitus:installable"));
      });
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* The document scrolls (screens lay their content out in flow), so mobile Safari collapses its bars. */
      /* These styles make the root element full-height */
      /* Always 1px taller than the screen, even for a frame with no page mounted (a tab's first visit): the installed
         iPhone app lays out a document that does not scroll one top inset shorter, which lifted the fixed tab bar. */
      #root {
        display: flex;
        height: 100%;
        min-height: calc(100lvh + 1px);
        flex: 1;
      }
      /* The strip under the clock (see the comment at #status-bar). Only the installed app on iOS; the min-height keeps
         it above WebKit's 10px "thin border" cutoff when the inset reads 0. */
      #status-bar {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: env(safe-area-inset-top);
        min-height: 12px;
        background-color: #000000;
        /* WebKit reads the colour but the strip paints nothing, so the page shows through. */
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        z-index: 2147483647;
        /* No pointer-events: none here: WebKit's edge probe hit-tests the strip and skips elements that opt out. */
      }
      @media (display-mode: standalone) {
        @supports (-webkit-touch-callout: none) {
          #status-bar {
            display: block;
          }
        }
      }
      /* Browser autofill paints saved e-mails/passwords on a light-blue box; keep the app's own field colours. */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus {
        -webkit-text-fill-color: currentColor;
        caret-color: currentColor;
        transition: background-color 9999s ease-out 0s;
      }
      /* Autofill fills the field before any input event; these animations tell AuthField so its label moves up. */
      input:-webkit-autofill {
        animation: autofill-start 1ms;
      }
      input:not(:-webkit-autofill) {
        animation: autofill-end 1ms;
      }
      @keyframes autofill-start {
        from { opacity: 1; }
        to { opacity: 1; }
      }
      @keyframes autofill-end {
        from { opacity: 1; }
        to { opacity: 1; }
      }
      /* Thin pill scrollbar on a clear track (chat list, sticker picker); the grey reads on light and dark themes. */
      /* Chrome ignores ::-webkit-scrollbar once scrollbar-color is set, so the standard pair is for Firefox only. */
      @supports not selector(::-webkit-scrollbar) {
        * {
          scrollbar-width: thin;
          scrollbar-color: rgba(128, 128, 128, 0.45) transparent;
        }
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track,
      ::-webkit-scrollbar-corner {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(128, 128, 128, 0.45);
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(128, 128, 128, 0.7);
      }
      ::-webkit-scrollbar-button {
        display: none;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- iOS 26+ blurs the top of installed web apps (Liquid Glass). WebKit drops the blur and fills the status bar
         with the colour of an opaque fixed box at the top edge (≥6px tall, ≥80% wide): this strip. Painted from the app theme. -->
    <div id="status-bar"></div>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
