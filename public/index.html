<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- PWA: installable on Android (Chrome) and iOS (Safari, "Adicionar à Tela de Início"). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Habitus" />
    <!-- iOS 26+ ignores this tag and theme-color; kept for older iOS. The installed app's top edge is handled by #status-bar below. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
      }
      // Chrome fires this once, possibly before React mounts: keep it for the "Instalar agora" button.
      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        window.__habitusInstall = event;
        window.dispatchEvent(new Event("habitus:installable"));
      });
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Browser autofill paints saved e-mails/passwords on a light-blue box; keep the app's own field colours. */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus {
        -webkit-text-fill-color: currentColor;
        caret-color: currentColor;
        transition: background-color 9999s ease-out 0s;
      }
      /* Autofill fills the field before any input event; these animations tell AuthField so its label moves up. */
      input:-webkit-autofill {
        animation: autofill-start 1ms;
      }
      input:not(:-webkit-autofill) {
        animation: autofill-end 1ms;
      }
      @keyframes autofill-start {
        from { opacity: 1; }
        to { opacity: 1; }
      }
      @keyframes autofill-end {
        from { opacity: 1; }
        to { opacity: 1; }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- iOS 26+ blurs the top of installed web apps (Liquid Glass). WebKit drops the blur and fills the status bar
         with the colour of an opaque fixed box at the top edge (≥6px tall, ≥80% wide): this strip. Painted from the app theme. -->
    <div id="status-bar" style="position: fixed; top: 0; left: 0; right: 0; height: max(env(safe-area-inset-top), 8px); background: #000000; z-index: 2147483647; pointer-events: none; display: none"></div>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
