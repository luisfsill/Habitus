<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- PWA: installable on Android (Chrome) and iOS (Safari, "Adicionar à Tela de Início"). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Habitus" />
    <!-- Translucent: the page runs under the clock (edge to edge). iOS reads this when the app is added to the Home Screen.
         iOS 26+ would blur that edge; #status-bar below turns it into a solid band in the page colour instead. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
      }
      // Chrome fires this once, possibly before React mounts: keep it for the "Instalar agora" button.
      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        window.__habitusInstall = event;
        window.dispatchEvent(new Event("habitus:installable"));
      });
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* The strip under the clock (see the comment at #status-bar). Only the installed app on iOS; the min-height keeps
         it above WebKit's 10px "thin border" cutoff when the inset reads 0. */
      #status-bar {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: env(safe-area-inset-top);
        min-height: 12px;
        background-color: #000000;
        /* WebKit reads the colour but the strip paints nothing, so the page shows through. */
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        z-index: 2147483647;
        /* No pointer-events: none here: WebKit's edge probe hit-tests the strip and skips elements that opt out. */
      }
      @media (display-mode: standalone) {
        @supports (-webkit-touch-callout: none) {
          #status-bar {
            display: block;
          }
          /* Edge to edge: with a translucent status bar, 100% height stops one inset short of the screen bottom.
             A fixed box uses the full screen. */
          #root {
            position: fixed;
            inset: 0;
            height: auto;
          }
        }
      }
      /* Browser autofill paints saved e-mails/passwords on a light-blue box; keep the app's own field colours. */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus {
        -webkit-text-fill-color: currentColor;
        caret-color: currentColor;
        transition: background-color 9999s ease-out 0s;
      }
      /* Autofill fills the field before any input event; these animations tell AuthField so its label moves up. */
      input:-webkit-autofill {
        animation: autofill-start 1ms;
      }
      input:not(:-webkit-autofill) {
        animation: autofill-end 1ms;
      }
      @keyframes autofill-start {
        from { opacity: 1; }
        to { opacity: 1; }
      }
      @keyframes autofill-end {
        from { opacity: 1; }
        to { opacity: 1; }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- iOS 26+ blurs the top of installed web apps (Liquid Glass). WebKit drops the blur and fills the status bar
         with the colour of an opaque fixed box at the top edge (≥6px tall, ≥80% wide): this strip. Painted from the app theme. -->
    <div id="status-bar"></div>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
