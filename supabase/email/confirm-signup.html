<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>Seu código do Habitus</title>
</head>
<body style="margin:0;padding:0;background-color:#000000;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">Seu código para confirmar a conta no Habitus.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#000000;">
  <tr>
    <td align="center" style="padding:40px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
        <tr>
          <td style="padding:0 8px 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:22px;font-weight:700;color:#F5F5F7;">
            Habitus<span style="color:#3D7BFF;">.</span>
          </td>
        </tr>
        <tr>
          <td style="background-color:#0E1018;border:1px solid #1F2433;border-radius:22px;padding:32px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <h1 style="margin:0 0 8px;font-size:28px;line-height:34px;font-weight:700;color:#F5F5F7;">Confirme sua conta</h1>
            <p style="margin:0 0 24px;font-size:16px;line-height:22px;color:#A1A1AA;">Digite este código no Habitus para terminar o cadastro:</p>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" style="background-color:#121A2E;border:1px solid #2A4580;border-radius:14px;padding:20px 12px;font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:36px;line-height:40px;font-weight:700;letter-spacing:10px;color:#FFFFFF;">{{ .Token }}</td>
              </tr>
            </table>
            <p style="margin:24px 0 0;font-size:15px;line-height:20px;color:#A1A1AA;">O código vale por <span style="color:#8FB3FF;font-weight:600;">1 hora</span>.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 8px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:18px;color:#71717A;">
            Se você não criou uma conta no Habitus, ignore este e-mail.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
